# Based on AZP configuration by Mateusz Loskot <mateusz at loskot dot net>

name: 'CI'

on:
  push:
    paths-ignore:
      - 'web/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  #  to fetch code (actions/checkout)

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "300M"

jobs:
  windows-msvc-msbuild:
    name: Windows (MSVC MSBuild)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-11-vs2026-arm
            arch: arm64

    steps:
    - uses: actions/checkout@v7.0.1

    # ccache not supported for this generator and/or Debug

    - name: 'Build'
      shell: cmd
      run: |
        cmake --version
        cmake ^
          -G "Visual Studio 18 2026" ^
          -A ${{ matrix.arch }} ^
          -D CMAKE_BUILD_TYPE=Debug ^
          -D CMAKE_CXX_STANDARD=17 ^
          -D BUILD_SHARED_LIBS=ON ^
          -S . -B build
        IF %ERRORLEVEL% NEQ 0 exit /B 1
        cmake --build build --config Debug -j 4 -- /p:CL_MPcount=4

    - name: 'Test'
      working-directory: build
      run: ctest --output-on-failure -C Debug

    - name: Install
      run: cmake --install build --config Debug

