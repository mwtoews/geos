# Based on AZP configuration by Mateusz Loskot <mateusz at loskot dot net>

name: 'CI'

on:
  push:
    paths-ignore:
      - 'web/**'
  pull_request:
    paths-ignore:
      - '**/.md'

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "300M"

jobs:
  windows-mingw:
    name: 'Windows (mingw-w64, x86_64, windows-2022)'
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      matrix:
        build_type: ['Debug', 'Release']

    steps:
    - name: 'Check Out'
      uses: actions/checkout@v6

    - name: 'Setup'
      uses: msys2/setup-msys2@v2
      with:
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make mingw-w64-x86_64-ccache
        update: true

    - name: Retrieve build cache
      id: restore-cache
      uses: actions/cache/restore@v5
      with:
        path: .ccache
        key: windows-mingw-${{ matrix.build_type}}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: windows-mingw-${{ matrix.build_type}}

    - name: 'Build'
      run: |
       export CCACHE_BASE_DIR=$(pwd)
       cmake --version
       cmake \
        -G"MSYS Makefiles" \
        -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
        -DUSE_CCACHE=ON \
        -S . -B build
       cmake --build build -j 2

    - name: Save build cache
      uses: actions/cache/save@v5
      with:
        path: .ccache
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}

    - name: 'Test'
      run: |
       cd build
       ctest --output-on-failure .

